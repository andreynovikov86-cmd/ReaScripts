name: Publish script updates to ReaPack
on:
  push:
    branches: [main]
    paths:
      - '*.lua'
      - 'ArticulationBox/**'
      - 'tools/publish_reapack.py'
      - '.github/workflows/reapack.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reapack-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release publishing
        run: python3 tests/test_publish_reapack.py
      - name: Prepare releases and version headers
        run: |
          python3 tools/publish_reapack.py prepare
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.lua' 'ArticulationBox/*.lua'
          if ! git diff --cached --quiet; then git commit -m 'Bump changed script versions for ReaPack'; fi
      - name: Build immutable index and manual download
        run: |
          python3 tools/publish_reapack.py build --source-sha "$(git rev-parse HEAD)"
          git add index.xml downloads/ArticulationBox.zip
          if ! git diff --cached --quiet; then git commit -m 'Publish ReaPack updates and manual download'; fi
          git push origin HEAD:main
