name: Publish audio tools catalog
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Version catalog assets
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          site = Path('site')
          index = site / 'index.html'
          html = index.read_text()
          for name in ('app.js', 'style.css'):
              asset = site / name
              version = sha256(asset.read_bytes()).hexdigest()[:12]
              fingerprinted = f'{asset.stem}.{version}{asset.suffix}'
              asset.rename(site / fingerprinted)
              html = html.replace(f'"{name}"', f'"{fingerprinted}"')
          index.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v5
